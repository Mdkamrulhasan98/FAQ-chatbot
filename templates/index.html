<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="chat-app">
    <div class="chat-header">
      <div class="avatar">🤖</div>
      <div>
        <h1>Riya Assistant</h1>
        <span>● Online</span>
      </div>
    </div>

    <div id="chatBox" class="chat-box"></div>

    <div class="chips">
      <button class="chip">Track my order</button>
      <button class="chip">Return policy</button>
      <button class="chip">Payment methods</button>
      <button class="chip">Delivery time</button>
    </div>

    <div class="input-row">
      <input id="userInput" type="text" placeholder="Type your question..." autocomplete="off" />
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
